# Auto-runs `dbt build --target prod` against BigQuery after merges to main
# that touch dbt models, and on demand via `workflow_dispatch`.
#
# This is the bridge between "PR merged, dbt code lives in main" and "the
# physical tables in `silver` / `gold` reflect that code". Without it, a
# PR that adds a new model or column can be merged while the matching
# BigQuery table is missing — surfacing only on the next downstream read.
#
# Trigger model:
#   • push to main + paths filter on dbt/** → runs automatically after merge —
#                                              UNLESS the compiled project is
#                                              identical to the last successful
#                                              build's (v1.97.0: a comment, a YAML
#                                              comment or config.py rebuilds
#                                              nothing; see "Compile and
#                                              fingerprint the project" below)
#   • schedule (Mon/Thu)                     → always builds: carries new Bronze
#   • workflow_dispatch                      → always builds: manual fix-up runs
#                                              (e.g. to materialize tables for a
#                                              still-open PR, or to opt into
#                                              --full-refresh)
#
# Snapshot policy: this workflow runs PLAIN `dbt build --target prod` —
# NOT `make dbt-build-prod-with-backup`. CLAUDE.md keeps the with-backup
# variant intentionally manual ("Operator responsibility: run
# dbt-build-prod-with-backup at least once per release boundary") so
# automated runs don't accumulate GCS snapshots. Operators still snapshot
# at meaningful release boundaries from their terminal.
#
# ─────────────────────────────────────────────────────────────────────────────
# ONE-TIME GCP SETUP (do this once per repo, then this workflow is hands-off):
#
#  1. Create a dedicated CI service account with write access to the Gold +
#     Silver datasets:
#
#       gcloud iam service-accounts create sa-dbt-build-ci \
#         --project="${GCP_PROJECT_ID}" \
#         --display-name="dbt build prod (GitHub Actions CI)"
#
#  2. Grant the BigQuery roles dbt needs to read Bronze, write Silver/Gold,
#     issue query jobs, and stream rows back via the Storage API. Granting
#     dataEditor at the project level is the simplest correct scope —
#     narrowing per-dataset is also valid if your org requires it.
#
#       gcloud projects add-iam-policy-binding "${GCP_PROJECT_ID}" \
#         --member="serviceAccount:sa-dbt-build-ci@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
#         --role="roles/bigquery.dataEditor"
#       gcloud projects add-iam-policy-binding "${GCP_PROJECT_ID}" \
#         --member="serviceAccount:sa-dbt-build-ci@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
#         --role="roles/bigquery.jobUser"
#       gcloud projects add-iam-policy-binding "${GCP_PROJECT_ID}" \
#         --member="serviceAccount:sa-dbt-build-ci@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
#         --role="roles/bigquery.readSessionUser"
#
#  3. Set up a GitHub Workload Identity Pool (one-time per repo) and bind the
#     pool to this SA so GitHub Actions can impersonate it via OIDC:
#
#       PROJECT_NUMBER=$(gcloud projects describe "${GCP_PROJECT_ID}" --format='value(projectNumber)')
#       gcloud iam workload-identity-pools create github \
#         --project="${GCP_PROJECT_ID}" --location="global" \
#         --display-name="GitHub Actions"
#       gcloud iam workload-identity-pools providers create-oidc github-provider \
#         --project="${GCP_PROJECT_ID}" --location="global" \
#         --workload-identity-pool="github" \
#         --display-name="GitHub OIDC" \
#         --attribute-mapping="google.subject=assertion.sub,attribute.repository=assertion.repository" \
#         --issuer-uri="https://token.actions.githubusercontent.com"
#       gcloud iam service-accounts add-iam-policy-binding \
#         "sa-dbt-build-ci@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
#         --role="roles/iam.workloadIdentityUser" \
#         --member="principalSet://iam.googleapis.com/projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/github/attribute.repository/OWNER/REPO"
#
#  4. Set repo-level variables (Settings → Secrets and variables → Actions
#     → Variables):
#
#       GCP_PROJECT_ID                  = your project id
#       GCP_WIF_PROVIDER                = projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/github/providers/github-provider
#       BQ_LOCATION                     = e.g. us-central1 (falls back to us-central1 if unset)
#       GCP_DBT_BUILD_SERVICE_ACCOUNT   = sa-dbt-build-ci@${GCP_PROJECT_ID}.iam.gserviceaccount.com
#       DBT_ENABLE_CURATION             = "true" AFTER the one-time prod curation
#                                         activation (docs/operations_runbook.md).
#                                         Adds enable_curation: true to the build's
#                                         --vars. NOTE: dbt_project.yml has ALSO
#                                         defaulted enable_curation to true since the
#                                         curation went live, so unsetting this does
#                                         NOT turn it off — that takes the project
#                                         default.
#       DBT_ENABLE_FOREIGN_INFLATION    = "true" AFTER the first
#                                         `embrapa ingest foreign-inflation --full`
#                                         (PLANS/correcao_inflacionaria_multimoeda.md);
#                                         unset/anything else = off. Adds
#                                         enable_foreign_inflation: true to the build's
#                                         --vars so the US CPI / euro-area HICP
#                                         deflators reach Gold.
#                                         It is a BUILD-ORDER gate: silver_foreign_inflation
#                                         reads a Bronze table that 404s before that first
#                                         ingest, and the failure would cascade into every
#                                         Gold model — so it must stay off until the data
#                                         is there.
#
# ─────────────────────────────────────────────────────────────────────────────
# MATERIALIZING TABLES FOR A STILL-OPEN PR:
#
#  If a PR introduces a new model whose physical BigQuery table needs to
#  exist before downstream tooling can read it (e.g. for a future smoke test
#  or downstream report), run this workflow manually before the PR merges:
#
#    1. Make sure the workflow file (this one) is on main. If not, merge the
#       PR that adds it first.
#    2. Go to Actions → "dbt build prod" → Run workflow. Pick main. Wait
#       for the run to complete (typically ~3–5 min).
#    3. Downstream readers (Looker Studio, ad-hoc queries, future UI) can
#       now see the new table.

name: dbt build prod

on:
  push:
    branches: [main]
    paths:
      - 'dbt/**'
      - 'src/embrapa_dashboard/config.py'  # Settings defaults consumed by dbt env_var()
      - '.github/workflows/dbt-build-prod.yml'
  schedule:
    # Scheduled prod build so INGESTED Bronze reaches Silver/Gold automatically —
    # the ingestion Job only writes Bronze, nothing here rebuilds the marts
    # between dbt-code pushes. This carries BOTH the nightly delta AND the
    # monthly `reconcile` deep-refresh through to the dashboard. 11:30 UTC is the
    # EARLIEST the run can start — chosen so it lands after the 05:00 BRT ingest
    # (1h max) and after the 11:00 UTC freshness check. What the cron guarantees is
    # that ORDER, never a finish time: GitHub schedules are best-effort, and this
    # repo's measured delay grew from ~20min (while the cron was daily, up to
    # 2026-08-26) to 3h35–9h58 after the twice-weekly change — e.g. 2026-09-03 fired
    # 15:05 UTC and 2026-09-07 16:35 UTC. The ordering still holds (later is still
    # after the ingest), so nothing downstream breaks; but do NOT schedule anything
    # against "Gold is ready by 09:00 BRT" — read the run, do not assume the clock.
    # A PLAIN (non --full-refresh) build is
    # enough — silver_ibge_pevs re-scans Bronze by ingestion_timestamp, not by
    # year, so an upstream correction to an OLD year flows all the way to Gold.
    # 2×/semana (seg e qui), não diário — o horário é o do gatilho, não o da execução
    # (ver acima). Medido 2026-08-28: o build responde por
    # 98,9% do BigQuery faturado (121,3 GB/semana contra 1,3 GB da ingestão inteira), e a
    # maior parte disso reconstruía entradas idênticas — as fontes não-câmbio avançam
    # mensal ou anualmente, e o câmbio entra no Gold como MÉDIA ANUAL (val_yearfx_* =
    # val_raw / brl_per_usd_avg), então um dia a mais de PTAX mal move o número exibido.
    # Duas vezes por semana, e não uma, porque os gatilhos mensais caem em DIAS FIXOS do
    # mês (PAM dia 2, PPM dia 3, COMTRADE dia 15) — que caem em qualquer dia da semana.
    # Com seg+qui, um dado que pousa fora do ciclo espera no máximo 3-4 dias; com segunda
    # apenas, esperaria 6.
    - cron: '30 11 * * 1,4'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Add --full-refresh (rebuild incremental models like silver_ibge_pevs from scratch). Default off — opt in only after schema changes or partition re-anchoring.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Never run two prod builds in parallel — they would race on the same
# physical tables. Don't cancel a running build either; mid-build cancels
# can leave Silver/Gold in inconsistent state. Queue new pushes instead.
concurrency:
  group: dbt-build-prod
  cancel-in-progress: false

# WIF needs id-token: write so GitHub mints an OIDC token for the auth step.
# actions: read lets the push-triggered run read the PREVIOUS build (its conclusion and
# its fingerprint artifact) to decide whether there is anything to rebuild.
permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  build:
    # Skip on forks — they can't reach the WIF provider (security boundary).
    # Skipped jobs satisfy required status checks in GitHub.
    if: github.event.repository.fork == false

    runs-on: ubuntu-latest
    timeout-minutes: 30

    # dbt_project.yml resolves its datasets + BCB inflation/currency series codes via
    # env_var(<name>, <default>) — those read the PROCESS env, not .env (which doesn't exist
    # in CI). Set them explicitly so a change to the prod config via repo variables takes
    # effect instead of silently using the baked-in defaults. The `|| '<default>'` fallbacks
    # mirror dbt_project.yml, so leaving the repo vars unset keeps the current (default)
    # behaviour. JOB-level, not step-level: the compile that is fingerprinted and the build
    # must see the SAME values, or the fingerprint would describe a different project.
    env:
      BQ_SILVER_DATASET: ${{ vars.BQ_SILVER_DATASET || 'silver' }}
      BQ_GOLD_DATASET: ${{ vars.BQ_GOLD_DATASET || 'gold' }}
      BQ_SERVING_DATASET: ${{ vars.BQ_SERVING_DATASET || 'serving' }}
      BCB_INFLATION_SERIES_IPCA_CODE: ${{ vars.BCB_INFLATION_SERIES_IPCA_CODE || '433' }}
      BCB_INFLATION_SERIES_IGPM_CODE: ${{ vars.BCB_INFLATION_SERIES_IGPM_CODE || '189' }}
      BCB_INFLATION_SERIES_IGPDI_CODE: ${{ vars.BCB_INFLATION_SERIES_IGPDI_CODE || '190' }}
      BCB_CURRENCY_SERIES: ${{ vars.BCB_CURRENCY_SERIES || '1:USD,21619:EUR' }}
      FOREIGN_INFLATION_CPI_CODE: ${{ vars.FOREIGN_INFLATION_CPI_CODE || 'CUUR0000SA0' }}
      FOREIGN_INFLATION_HICP_CODE: ${{ vars.FOREIGN_INFLATION_HICP_CODE || 'HICP.M.U2.N.000000.4D0.INX' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Auth to GCP via Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DBT_BUILD_SERVICE_ACCOUNT }}

      # Pin to the exact interpreter required by pyproject.toml
      # (requires-python = "==3.12.*").
      - name: Set up Python 3.12.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12.11"

      - name: Install uv (with cache keyed on uv.lock)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # --frozen makes the sync fail if uv.lock drifts from pyproject.toml.
      # dbt-core + dbt-bigquery are project dependencies; no extras needed.
      - name: Sync dependencies
        run: uv sync --frozen

      # Inline profile — does NOT use impersonate_service_account because
      # WIF has already authenticated us AS the dbt-build SA. The example
      # profile (dbt/profiles.yml.example) hard-codes impersonation for
      # local dev where users authenticate as themselves; that flag would
      # short-circuit our WIF identity here.
      - name: Generate dbt profile (oauth via ADC from WIF)
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          BQ_LOCATION: ${{ vars.BQ_LOCATION || 'us-central1' }}
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          embrapa_dashboard:
            target: prod
            outputs:
              prod:
                type: bigquery
                method: oauth
                project: ${GCP_PROJECT_ID}
                dataset: prod
                location: ${BQ_LOCATION}
                threads: 8
                job_execution_timeout_seconds: 600
                job_retries: 1
                priority: batch
          EOF

      - name: dbt deps (install dbt_utils)
        working-directory: dbt
        run: uv run dbt deps

      # `dbt build` runs models + tests in dependency order. With --target
      # prod we write to the `silver` and `gold` datasets (per
      # BQ_*_DATASET defaults in dbt_project.yml). All gold_* tables are
      # `materialized=table` so they fully rebuild every run — picking up
      # any new columns from the merged PRs automatically.
      #
      # The full_refresh input is for cases where an incremental model
      # (silver_ibge_pevs) needs a re-anchor — e.g. after schema or
      # partition-key changes upstream.
      #
      # The DBT_ENABLE_CURATION repo variable (default off) gates the SCD2
      # curation view (dim_code_industrialization_scd2,
      # `enabled=var('enable_curation', false)`). Flip it to "true" after the
      # one-time prod activation (docs/operations_runbook.md § Activating
      # curation in prod) so merged changes to that view — and its schema
      # tests — keep propagating on every automated build.
      #
      # DBT_ENABLE_FOREIGN_INFLATION does the same for silver_foreign_inflation (the US
      # CPI / euro-area HICP deflators). Different reason, same mechanism: that one is a
      # BUILD-ORDER gate, not a feature switch — its Bronze source 404s until the first
      # `embrapa ingest foreign-inflation`, and that would fail every Gold model
      # downstream. Off, the val_real_{cpi,hicp}_* columns still exist and come out NULL.
      # The arguments are assembled ONCE and read by both the compile below and the
      # build: a fingerprint computed under different --vars than the build uses would
      # describe another project — a change to a var-gated model (the curation views, the
      # foreign deflators) would be invisible to it, and the build would be skipped wrongly.
      - name: Assemble dbt arguments
        run: |
          ARGS=(--target prod)
          if [ "${{ github.event.inputs.full_refresh }}" = "true" ]; then
            echo "::notice::Running with --full-refresh (incremental models will rebuild from scratch)"
            ARGS+=(--full-refresh)
          fi
          # ONE --vars mapping for every switch. dbt keeps only the LAST --vars flag (it
          # does not merge them), so one flag per switch silently dropped all but the
          # last: with both variables true, enable_curation never reached dbt (measured
          # 2026-09-24; tests/test_dbt_prod_vars.py runs this script to prove the fix).
          VARS=()
          if [ "${{ vars.DBT_ENABLE_CURATION }}" = "true" ]; then
            echo "::notice::DBT_ENABLE_CURATION=true — building the gated SCD2 curation views"
            VARS+=("enable_curation: true")
          fi
          if [ "${{ vars.DBT_ENABLE_FOREIGN_INFLATION }}" = "true" ]; then
            echo "::notice::DBT_ENABLE_FOREIGN_INFLATION=true — building the foreign deflators (CPI/HICP)"
            VARS+=("enable_foreign_inflation: true")
          fi
          if [ ${#VARS[@]} -gt 0 ]; then
            joined=$(printf '%s, ' "${VARS[@]}")
            ARGS+=(--vars "{${joined%, }}")
          fi
          # One argument per line (none contains a newline); read back with mapfile.
          printf '%s\n' "${ARGS[@]}" > "$RUNNER_TEMP/dbt_args"

      # SKIP A BUILD THAT WOULD CHANGE NOTHING (v1.97.0). A push rebuilds prod even when
      # the commit only touched a comment, a YAML comment or config.py (which dbt never
      # reads in CI): 46 of the 63 builds in the 30 days to 2026-09-26 were push-triggered,
      # at ~18 GiB each. This step compiles the project with the SAME arguments the build
      # uses (compile only reads table metadata — no bytes billed) and reduces it to a
      # fingerprint: scripts/dbt_build_fingerprint.py says what counts and what does not.
      # EVERY run computes it, so the scheduled and manual builds also leave the baseline
      # the next push compares against.
      - name: Compile and fingerprint the project
        working-directory: dbt
        run: |
          mapfile -t ARGS < "$RUNNER_TEMP/dbt_args"
          uv run dbt compile "${ARGS[@]}"
          mkdir -p "$RUNNER_TEMP/fingerprint"
          uv run python ../scripts/dbt_build_fingerprint.py compute target/manifest.json \
            --project-dir . --workflow ../.github/workflows/dbt-build-prod.yml \
            --out "$RUNNER_TEMP/fingerprint/fingerprint.json"

      # ONLY a push can be skipped. The scheduled and manual builds exist to carry NEW
      # BRONZE DATA to Silver/Gold — their code is usually unchanged, and that is exactly
      # when they must run. Every doubt resolves to BUILD: no previous run, a previous run
      # that did not succeed (a failed or cancelled build may have left prod half-built,
      # so its fingerprint no longer describes prod), a missing artifact, an unreadable
      # file, or any difference at all.
      - name: Decide whether this push changes what the build produces
        id: decide
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          skip=false
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow dbt-build-prod.yml \
                   --branch main --status completed --limit 20 \
                   --json databaseId,conclusion,headSha \
                   --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)][0] // empty | \"\(.databaseId) \(.conclusion) \(.headSha)\"") || prev=""
          read -r prev_id prev_conclusion prev_sha <<< "$prev"
          if [ -z "${prev_id:-}" ]; then
            reason="no completed build to compare with"
          elif [ "$prev_conclusion" != "success" ]; then
            reason="the last build (run $prev_id) ended '$prev_conclusion' — prod may be half-built"
          elif ! gh run download "$prev_id" --repo "$GITHUB_REPOSITORY" \
                 -n dbt-build-fingerprint -D "$RUNNER_TEMP/baseline"; then
            reason="run $prev_id left no fingerprint to compare with"
          elif uv run python scripts/dbt_build_fingerprint.py compare \
                 "$RUNNER_TEMP/baseline/fingerprint.json" "$RUNNER_TEMP/fingerprint/fingerprint.json"; then
            skip=true
            reason="the compiled project is identical to run $prev_id (${prev_sha:0:9})"
          else
            reason="the compiled project differs from run $prev_id (${prev_sha:0:9})"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = true ]; then
            echo "::notice::Build skipped — $reason. Nothing this push changed reaches BigQuery."
            {
              echo "## ⏭️ prod dbt build skipped — nothing to rebuild"
              echo ""
              echo "$reason: every model, test, seed, persisted description and project"
              echo "macro compiles to the same thing. The tables in prod already are what this"
              echo "commit would build. New Bronze data still reaches Gold on the scheduled"
              echo "build (Mon/Thu); to force one now: \`gh workflow run dbt-build-prod.yml --ref main\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::Building — $reason."
          fi

      - name: dbt build prod
        if: steps.decide.outputs.skip != 'true'
        working-directory: dbt
        run: |
          mapfile -t ARGS < "$RUNNER_TEMP/dbt_args"
          uv run dbt build "${ARGS[@]}"

      # Curadoria lifecycle: auto-mark orphan produtos (removed from the catalog but
      # with Gold data still lingering) as Descontinuado, on the build boundary — orphan
      # status only changes when Gold or the catalog change, both of which happen here, so
      # no separate scheduler is needed. NON-DESTRUCTIVE (the purge is a human-gated CLI).
      # Best-effort: needs the `webapi` extra (the cache for the memoized reads) and must
      # NOT fail the build (the marts are already rebuilt) — continue-on-error.
      - name: Mark orphan produtos (Curadoria lifecycle)
        if: success() && steps.decide.outputs.skip != 'true'
        continue-on-error: true
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          BQ_LOCATION: ${{ vars.BQ_LOCATION || 'us-central1' }}
          BQ_GOLD_DATASET: ${{ vars.BQ_GOLD_DATASET || 'gold' }}
          BQ_RESEARCH_INPUTS_DATASET: ${{ vars.BQ_RESEARCH_INPUTS_DATASET || 'research_inputs' }}
        run: uv run --extra webapi embrapa mark-orphans

      # The baseline for the NEXT push. Uploaded only on success — a failed run's
      # fingerprint would claim prod holds what it failed to build. A skipped run uploads
      # too: its fingerprint equals the one it matched, so the chain stays anchored.
      - name: Keep this build's fingerprint
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dbt-build-fingerprint
          path: ${{ runner.temp }}/fingerprint/fingerprint.json
          retention-days: 90
          if-no-files-found: error

      # Alerting (intentionally GitHub-native, like dbt-source-freshness.yml): this
      # build is the ONLY stage that carries Bronze → the Silver/Gold/serving marts
      # the dashboard reads, so a silent failure here leaves the marts STALE while
      # the freshness check keeps PASSING (Bronze is fresh; only the marts lag), and
      # `dbt build` runs tests inline so one failing test now also blocks the
      # rebuild. A failed SCHEDULED run emails the user who last edited the cron on
      # the default branch (GitHub's documented notification) — that is the page.
      # This step makes it LOUD + actionable in the run's Job Summary too, so a red
      # nightly build names the stale-marts consequence up front instead of just a
      # red dot in the Actions tab. (To add a secondary channel — Slack, an
      # auto-filed Issue — extend this `if: failure()` step.)
      - name: Flag stale marts on failure
        if: failure()
        run: |
          {
            echo "## 🚨 prod dbt build FAILED — serving marts may be STALE"
            echo ""
            echo "Bronze is unaffected (and source-freshness will keep passing), but"
            echo "Silver/Gold/serving did **not** finish rebuilding, so the dashboard"
            echo "may serve data from the previous successful build until this is fixed."
            echo ""
            echo "**Check:** the failing step's log above — a dbt **test** failure (run"
            echo "inline by \`dbt build\`) also blocks the model rebuild. Re-run after the"
            echo "fix; use the \`full_refresh\` dispatch input only after schema changes."
          } >> "$GITHUB_STEP_SUMMARY"
